[project]
name = "prism-genai-2k26"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "faiss-cpu",
    "mteb==2.21.0",
    "numpy>=1.26",
    "torch>=2.7",
    "torchvision",
    "sentence-transformers>=5.1",
    "optimum-intel[openvino,nncf]",
    # 0.26.0 corrupts node positions and segfaults on real JS files (Node-RED); 0.25.2 is fine.
    "tree-sitter>=0.25,<0.26",
    "tree-sitter-python",
    "tree-sitter-javascript",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coderet"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# CUDA wheels so documents can be encoded offline on GPU; query-time paths
# run on CPU (CUDA_VISIBLE_DEVICES="").
[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]
# torchvision is pulled in transitively; it must come from the same index as torch.
torchvision = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
